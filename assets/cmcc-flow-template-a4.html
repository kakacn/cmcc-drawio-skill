<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CMCC 流程图 · A4版</title>
<style>
  :root{
    --cm:#008FD7; --cm-deep:#0067AC; --cm-dark:#0A3D66;
    --cm-ink:#33566E; --cm-mute:#6B8CA3; --cm-line:#C9E2F2;
    --warn:#F39800;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  /* 1600px = 160mm（10px/mm），导出 scale 1.2 → 1920px ≈ 305dpi@160mm */
  .sheet{width:1600px;height:1390px;position:relative;overflow:hidden;
    background:linear-gradient(180deg,#F0F8FE 0%,#FFFFFF 55%)}
  .band{position:absolute;top:0;left:0;right:0;height:150px;
    background:linear-gradient(100deg,#0AA5E2 0%,#0078BE 55%,#005E9C 100%)}
  .band svg{position:absolute;bottom:-1px;left:0}
  .band-title{position:absolute;left:56px;top:34px;color:#fff}
  .band-title h1{font-size:40px;font-weight:800;letter-spacing:.08em}
  .band-title p{margin-top:14px;font-size:25px;color:rgba(255,255,255,.88);letter-spacing:.1em}
  .band-legend{position:absolute;right:56px;top:58px;display:flex;gap:30px;
    font-size:24px;color:rgba(255,255,255,.92);letter-spacing:.06em}
  .band-legend span{display:inline-flex;align-items:center;gap:10px}
  .lg-solid{width:60px;height:0;border-top:5px solid #fff;border-radius:2px}
  .lg-dash{width:60px;height:0;border-top:5px dashed var(--warn)}
  .lg-dia{width:22px;height:22px;border:3px solid #fff;transform:rotate(45deg);border-radius:3px}
  .deco-circle{position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}

  .row{position:absolute;left:40px;right:40px;display:flex;gap:40px;z-index:1;justify-content:center}
  .row1{top:200px}
  .row2{top:930px}
  .card{width:350px;height:360px;position:relative;background:#fff;
    border:2px solid var(--cm-line);border-radius:20px;
    box-shadow:0 10px 26px rgba(0,103,172,.10);padding:26px 26px 18px}
  .card::before{content:"";position:absolute;top:0;left:20px;right:20px;height:7px;
    background:linear-gradient(90deg,#0AA5E2,#005E9C);border-radius:0 0 6px 6px}
  .chip{display:inline-flex;align-items:center;justify-content:center;min-width:86px;height:86px;
    border-radius:20px;background:linear-gradient(135deg,#12A6E4,#0067AC);
    color:#fff;font-size:42px;font-weight:800}
  .card h3{display:inline-block;vertical-align:middle;margin-left:16px;font-size:34px;
    font-weight:800;color:var(--cm-dark);letter-spacing:.02em}
  .head{display:flex;align-items:center}
  .divider{height:2px;background:var(--cm-line);margin:22px 0 16px}
  .card p{font-size:26px;line-height:1.65;color:var(--cm-ink)}
  .card.end{background:linear-gradient(150deg,#0AA5E2,#005E9C);border-color:transparent;
    box-shadow:0 12px 28px rgba(0,94,156,.35)}
  .card.end::before{background:rgba(255,255,255,.45)}
  .card.end h3{color:#fff}
  .card.end p{color:rgba(255,255,255,.9)}
  .card.end .divider{background:rgba(255,255,255,.3)}
  .card.end .chip{background:#fff;color:var(--cm-deep)}
  .end-flag{position:absolute;top:-16px;right:20px;background:var(--warn);color:#fff;
    font-size:24px;font-weight:700;letter-spacing:.18em;padding:5px 18px;border-radius:30px}

  .pt{position:absolute;width:2px;height:2px}
  .pt-l{left:-1px;top:50%;margin-top:-1px}
  .pt-r{right:-1px;top:50%;margin-top:-1px}
  .pt-b{bottom:-1px;left:50%;margin-left:-1px}
  .pt-t{top:-1px;left:50%;margin-left:-1px}

  .diamond-wrap{position:absolute;width:200px;height:200px;top:630px;z-index:1}
  .diamond-wrap .pt-t{top:calc(50% - 71px);left:50%;margin:-1px 0 0 -1px}
  .diamond-wrap .pt-b{top:calc(50% + 71px);left:50%;margin:-1px 0 0 -1px}
  .diamond-wrap .pt-l{left:calc(50% - 71px);top:50%;margin:-1px 0 0 -1px}
  .diamond-wrap .pt-r{left:calc(50% + 71px);top:50%;margin:-1px 0 0 -1px}
  .diamond{position:absolute;inset:29px;background:#fff;border:3px solid var(--cm);
    border-radius:12px;transform:rotate(45deg);box-shadow:0 8px 20px rgba(0,103,172,.15)}
  .diamond span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    transform:rotate(-45deg);text-align:center;font-size:26px;font-weight:800;
    color:var(--cm-dark);line-height:1.5}
  #wires text{font-family:var(--sans);font-size:26px;font-weight:700;letter-spacing:.04em;
    paint-order:stroke;stroke:#fff;stroke-width:8px;stroke-linejoin:round}
  .foot{position:absolute;left:56px;bottom:22px;font-size:23px;color:var(--cm-mute);letter-spacing:.08em}
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <div class="band">
    <svg width="1600" height="40" viewBox="0 0 1600 40" preserveAspectRatio="none">
      <path d="M0 24 C 240 3, 420 40, 670 19 S 1140 0, 1600 22 L1600 40 L0 40 Z" fill="rgba(255,255,255,.18)"/>
      <path d="M0 31 C 290 12, 560 40, 860 24 S 1280 8, 1600 29 L1600 40 L0 40 Z" fill="rgba(255,255,255,.28)"/>
    </svg>
    <div class="deco-circle" style="width:260px;height:260px;right:300px;top:-150px"></div>
    <div class="deco-circle" style="width:140px;height:140px;right:180px;top:36px"></div>
    <div class="band-title">
      <h1 id="cfg-title"></h1>
      <p id="cfg-subtitle"></p>
    </div>
    <div class="band-legend">
      <span><i class="lg-solid"></i>主流程</span>
      <span><i class="lg-dash"></i>退回修订</span>
      <span><i class="lg-dia"></i>审议判断</span>
    </div>
  </div>

  <svg id="wires" style="position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible" aria-hidden="true">
    <defs>
      <marker id="aBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#008FD7"/></marker>
      <marker id="aWarn" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F39800"/></marker>
    </defs>
  </svg>

  <div class="row row1" id="row1"></div>
  <div class="diamond-wrap" id="d1">
    <i class="pt pt-t"></i><i class="pt pt-b"></i><i class="pt pt-l"></i><i class="pt pt-r"></i>
    <div class="diamond"><span id="cfg-q"></span></div>
  </div>
  <div class="row row2" id="row2"></div>
  <div class="foot" id="cfg-foot"></div>
</div>

<script>
/* ═══════════ 配置区：修改此处即可复用 ═══════════
   结构固定：6 张卡片（3+3 两行）+ 1 个判断菱形（挂第一行第 3 卡下方）。
   菱形"是"→ 第二行第 1 卡；"否"→ 退回第一行第 2 卡。
   步骤数不为 6 时需手工调整布局。 */
var CONFIG = {
  title: "中国移动基层工会预算调整流程图",   // 命名规范：中国移动基层工会{流程名称}流程图
  subtitle: "提出 → 审查 → 审批 → 备案 → 执行，审查未通过退回修改方案",
  footLeft: "依据：中国移动基层工会工作标准化手册（工会经费管理模块）",
  cards: [
    { title: "提出调整需求", desc: "因工作计划变更、政策调整等原因，需要调整预算时，启动预算调整程序。" },
    { title: "制定调整方案", desc: "工会提出预算调整方案。" },
    { title: "提交经审委审查", desc: "将预算调整方案提交本级经费审查委员会审查。" },
    { title: "提交工会委员会审批", desc: "经审查通过后，提交本级工会委员会审批。" },
    { title: "报上级备案或批准", desc: "工会委员会审批通过后，报上级工会备案或批准。" },
    { title: "按调整后预算执行", desc: "经上级工会备案或批准后，按调整后的预算组织执行。", terminal: true }
  ],
  decision: { question: "审查\n通过？", label: "否 · 退回修改调整方案" }
};
/* ═══════════ 渲染引擎（结构固定，一般无需修改） ═══════════ */
(function(){
  var NS='http://www.w3.org/2000/svg';
  var sheet=document.getElementById('sheet'), svg=document.getElementById('wires');
  document.getElementById('cfg-title').textContent=CONFIG.title;
  document.getElementById('cfg-subtitle').textContent=CONFIG.subtitle;
  document.getElementById('cfg-foot').textContent=CONFIG.footLeft;
  document.getElementById('cfg-q').innerHTML=CONFIG.decision.question.replace(/\n/g,'<br>');

  function makeCard(s,i){
    var c=document.createElement('div');
    c.className='card'+(s.terminal?' end':''); c.id='c'+(i+1);
    var anchors='<i class="pt pt-b"></i>';
    if(i%3>0)anchors+='<i class="pt pt-l"></i>';
    if(i%3<2)anchors+='<i class="pt pt-r"></i>';
    if(i===3)anchors+='<i class="pt pt-t"></i>';   // 第二行首卡：接收菱形"是"的顶部入线
    c.innerHTML=anchors+(s.terminal?'<span class="end-flag">END</span>':'')+
      '<div class="head"><span class="chip">'+String(i+1).padStart(2,'0')+'</span><h3>'+s.title+'</h3></div>'+
      '<div class="divider"></div><p>'+s.desc+'</p>';
    return c;
  }
  var r1=document.getElementById('row1'), r2=document.getElementById('row2');
  CONFIG.cards.forEach(function(s,i){
    (i<3?r1:r2).appendChild(makeCard(s,i));
  });

  function pt(sel){var el=document.querySelector(sel);var r=el.getBoundingClientRect();var c=sheet.getBoundingClientRect();
    return {x:r.left-c.left+r.width/2,y:r.top-c.top+r.height/2}}
  function center(el){var r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
  function add(d,color,dash,marker){var p=document.createElementNS(NS,'path');p.setAttribute('class','wire');
    p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',color);
    p.setAttribute('stroke-width','5');if(dash)p.setAttribute('stroke-dasharray',dash);
    p.setAttribute('marker-end',marker);svg.appendChild(p)}
  function label(x,y,text,color,anchor){var t=document.createElementNS(NS,'text');t.setAttribute('class','wlabel');
    t.setAttribute('x',x);t.setAttribute('y',y);t.setAttribute('text-anchor',anchor||'start');
    t.setAttribute('fill',color);t.textContent=text;svg.appendChild(t)}
  function wire(fSel,tSel){var f=pt(fSel),t=pt(tSel);
    add('M '+f.x+' '+f.y+' L '+(t.x-2)+' '+t.y,'#008FD7',null,'url(#aBlue)')}

  var c3c=center(document.getElementById('c3'));
  document.getElementById('d1').style.left=(c3c.x-100-sheet.getBoundingClientRect().left)+'px';
  svg.setAttribute('viewBox','0 0 1600 1390');

  wire('#c1 .pt-r','#c2 .pt-l');
  wire('#c2 .pt-r','#c3 .pt-l');
  wire('#c4 .pt-r','#c5 .pt-l');
  wire('#c5 .pt-r','#c6 .pt-l');

  (function(){
    var f=pt('#c3 .pt-b'), t=pt('#d1 .pt-t');
    add('M '+f.x+' '+f.y+' L '+t.x+' '+(t.y-2),'#008FD7',null,'url(#aBlue)');
    f=pt('#d1 .pt-l'); var c4t=pt('#c4 .pt-t');
    add('M '+f.x+' '+f.y+' H '+c4t.x+' V '+(c4t.y-2),'#008FD7',null,'url(#aBlue)');
    label(f.x-18,f.y-14,'是','#008FD7','end');
    f=pt('#d1 .pt-b'); var c2b=pt('#c2 .pt-b');
    var busY=870;
    add('M '+f.x+' '+f.y+' V '+busY+' H '+c2b.x+' V '+(c2b.y+2),'#F39800','10 8','url(#aWarn)');
    label(c2b.x+20,busY-16,CONFIG.decision.label,'#F39800');
  })();
})();
</script>
</body>
</html>
